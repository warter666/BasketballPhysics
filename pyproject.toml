[project]
name = "basketball-physics-lab"
version = "0.3.0"
description = "SHOT LAB + SHOT DUEL — 投篮物理实验室与对决小游戏（纯 Python 标准库）"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.scripts]
shotlab = "shotlab.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["shotlab*"]
